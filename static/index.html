<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Capture Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!--
  Dashboard shell for the lecture pipeline.

  Four constraints shaped this file.

  1. The backend is authoritative. The UI never infers progress from elapsed
     time or from a local countdown; it renders exactly what the SSE stream
     reports. Inventing a plausible-looking progress bar here would be a lie the
     operator could not detect, and a lecture's real duration is far too
     variable to estimate honestly.

  2. The pipeline has three long phases and no progress reporting inside them.
     Transcription in particular takes tens of minutes and emits nothing. So the
     UI has to make "still working" legible, which is why the stage tracker and
     the active state are a labelled, animated status card rather than a line of
     text.

  3. Push, not poll. The stream pushes the current state on connect and every
     change after it, so there are no requests at all while a dashboard sits
     idle, and no up-to-two-second lag on a phase change.

  4. The control deck mirrors the server's rules rather than approximating them.
     The backend refuses a second POST /api/record with 409 and refuses
     POST /api/stop with 400 unless a recording is in flight, so the buttons
     enable and disable themselves off the state the stream reports. The
     operator is never left to discover a rule by hitting an error.

  No framework and no build step: the shell is a placeholder, and a bundler
  would be a maintenance cost with nothing to amortise it against yet.
-->
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">

  <main class="mx-auto flex min-h-screen max-w-3xl flex-col justify-center px-6 py-12">

    <header class="mb-10 text-center">
      <h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">
        Academic Capture Engine
      </h1>
      <p class="mt-3 text-sm text-slate-400">
        Record a lecture, transcribe it, and generate study notes.
      </p>
    </header>

    <!--
      Stage tracker. Every pill below is a function of the reported status and
      nothing else -- no timers, no interpolation. That is deliberate: the
      backend reports phase *transitions* only, so anything the UI showed
      between two transitions would be a fabrication. A stage that is neither
      done nor active is genuinely not known yet, and is drawn as such.
    -->
    <ol id="stage-tracker" class="mb-8 flex items-center gap-2 sm:gap-3">
      <!-- Populated by renderStages() below. -->
    </ol>

    <!--
      Capture form. Disabled while a run is in flight: the backend answers 409
      for a second POST, so the controls reflect the server's rule instead of
      letting the operator discover it via an error.
    -->
    <section class="rounded-xl border border-slate-800 bg-slate-900/60 p-6 shadow-xl">
      <form id="record-form" class="space-y-5">

        <div>
          <label for="course_code" class="mb-1.5 block text-sm font-medium text-slate-300">
            Course Code
          </label>
          <input
            id="course_code"
            name="course_code"
            type="text"
            required
            maxlength="64"
            placeholder="e.g., CRM_3102"
            autocomplete="off"
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-2.5
                   text-slate-100 placeholder-slate-600 outline-none
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-500/40
                   disabled:cursor-not-allowed disabled:bg-slate-900 disabled:text-slate-600"
          />
        </div>

        <div>
          <label for="language" class="mb-1.5 block text-sm font-medium text-slate-300">
            Language
          </label>
          <!--
            A select rather than a free-text field, so an unsupported code
            cannot be typed at all. That is a real narrowing of what the API
            accepts (it takes any two-letter code), so the list is deliberately
            broad rather than the three most obvious ones -- a lecturer whose
            language is missing from this list cannot record their own class.
            The API's own validation remains the backstop; this is a first line
            of defence, not the only one.
          -->
          <select
            id="language"
            name="language"
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-2.5
                   text-slate-100 outline-none
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-500/40
                   disabled:cursor-not-allowed disabled:bg-slate-900 disabled:text-slate-600"
          >
            <option value="en">English (en)</option>
            <option value="fr">French (fr)</option>
            <option value="sw">Swahili (sw)</option>
            <option value="es">Spanish (es)</option>
            <option value="pt">Portuguese (pt)</option>
            <option value="ar">Arabic (ar)</option>
            <option value="am">Amharic (am)</option>
            <option value="yo">Yoruba (yo)</option>
            <option value="ha">Hausa (ha)</option>
            <option value="zu">Zulu (zu)</option>
            <option value="zh">Chinese (zh)</option>
            <option value="de">German (de)</option>
          </select>
        </div>

        <!--
          Control deck. Both buttons are always in the DOM and toggled with
          `hidden` rather than removed and re-created: a re-created button
          loses focus, and losing focus mid-run is exactly the moment the
          operator is least able to spare the attention to find it again.
        -->
        <div class="flex flex-col gap-3 sm:flex-row">
          <button
            id="record-button"
            type="submit"
            class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white
                   transition hover:bg-blue-500
                   focus:outline-none focus:ring-2 focus:ring-blue-400
                   disabled:cursor-not-allowed disabled:bg-slate-700 disabled:text-slate-500"
          >
            Start Capture
          </button>

          <!--
            type="button" and not submit: this lives inside the form, and a
            submit here would fire a second POST /api/record instead of the
            stop the operator asked for.
          -->
          <button
            id="stop-button"
            type="button"
            class="w-full rounded-lg border border-red-900/70 bg-red-950/40 px-4 py-3
                   font-semibold text-red-300 transition hover:bg-red-900/40
                   focus:outline-none focus:ring-2 focus:ring-red-400
                   disabled:cursor-not-allowed disabled:border-slate-800
                   disabled:bg-slate-900 disabled:text-slate-600"
          >
            Finish Class
          </button>
        </div>

        <!--
          A disabled processing state, distinct from both buttons. During
          transcription the deck shows neither a stop nor a start -- the operator
          has nothing useful to click, and offering a "Finish Class" that the
          backend would answer with 400 would be worse than showing nothing.
        -->
        <p
          id="processing-state"
          class="hidden items-center justify-center gap-2.5 rounded-lg border
                 border-slate-800 bg-slate-900 px-4 py-3 text-sm text-slate-400"
          role="status"
        >
          <span
            class="h-2 w-2 shrink-0 rounded-full bg-blue-400 animate-pulse"
            aria-hidden="true"
          ></span>
          <span id="processing-text">Processing the lecture...</span>
        </p>
      </form>
    </section>

    <!--
      Live status. Populated entirely from the SSE stream; every element inside
      is driven by render() below and carries no state of its own.
    -->
    <section
      id="status-card"
      class="mt-8 rounded-xl border border-slate-800 bg-slate-900/60 p-6"
      aria-live="polite"
    >
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <!-- Pulse dot: visible only while a run is active. Purely decorative,
               so it is hidden from assistive tech. -->
          <span
            id="status-dot"
            class="hidden h-3 w-3 rounded-full bg-blue-500"
            aria-hidden="true"
          ></span>
          <h2 class="text-lg font-semibold text-white">
            <span id="status-label">Idle</span>
          </h2>
        </div>
        <span
          id="status-badge"
          class="rounded-full px-3 py-1 text-xs font-mono uppercase tracking-wide
                 bg-slate-800 text-slate-400"
        >
          idle
        </span>
      </div>

      <p id="status-message" class="mt-3 text-sm leading-relaxed text-slate-400">
        Ready. Submit a course code to begin a recording.
      </p>

      <p id="status-course" class="mt-2 hidden text-sm text-slate-500">
        Course: <span id="status-course-value" class="font-mono text-slate-300"></span>
      </p>

      <!--
        Connection indicator. Separate from the status card on purpose: "the
        pipeline is transcribing" and "we have lost the server" are independent
        facts, and collapsing them into one message would make a stale card
        indistinguishable from a live one. The card below keeps showing the last
        state it was told, marked as stale rather than blanked -- a dashboard
        that empties itself during a network blip is worse than one showing
        slightly old truth, as long as it says so.
      -->
      <p
        id="connection-banner"
        class="mt-4 flex items-center gap-2 rounded-lg border border-amber-900/60
               bg-amber-950/30 px-3 py-2 text-xs text-amber-200"
        role="status"
      >
        <span
          id="connection-dot"
          class="h-2 w-2 shrink-0 rounded-full bg-amber-400 animate-pulse"
          aria-hidden="true"
        ></span>
        <span id="connection-text">Connecting to the server...</span>
        <button
          id="connection-retry"
          type="button"
          class="ml-auto hidden rounded border border-amber-700/70 px-2 py-0.5
                 font-medium text-amber-100 hover:bg-amber-900/40"
        >
          Retry
        </button>
      </p>
    </section>

    <!--
      Start-form feedback. Kept separate from the status card so a rejected
      submission (409, 422) is not mistaken for the pipeline's own state.
    -->
    <p
      id="form-error"
      class="mt-4 hidden rounded-lg border border-red-900/60 bg-red-950/40 px-4 py-3 text-sm text-red-300"
      role="alert"
    ></p>

  </main>

<script>
(() => {
  "use strict";

  const RECORD_URL = "/api/record";
  const STOP_URL = "/api/stop";
  const STREAM_URL = "/api/stream";

  // Backend status tokens -> what the operator sees. Kept as a lookup rather
  // than a chain of ifs so an unrecognised token falls through to a safe
  // default instead of rendering as raw snake_case.
  const LABELS = {
    idle:         { label: "Idle",          dot: null,   badge: "bg-slate-800 text-slate-400" },
    recording:    { label: "Recording",     dot: "bg-red-500",     badge: "bg-red-500/20 text-red-300" },
    transcribing: { label: "Transcribing",  dot: "bg-blue-500",    badge: "bg-blue-500/20 text-blue-300" },
    synthesizing: { label: "Synthesizing",  dot: "bg-blue-500",    badge: "bg-blue-500/20 text-blue-300" },
    complete:     { label: "Complete",      dot: "bg-emerald-500", badge: "bg-emerald-500/20 text-emerald-300" },
    error:        { label: "Failed",        dot: "bg-amber-500",   badge: "bg-amber-500/20 text-amber-300" },
  };

  const UNKNOWN = { label: "Unknown", dot: null, badge: "bg-slate-800 text-slate-400" };

  // States in which a run is in flight. The form is locked during these so the
  // operator cannot queue a second recording the backend will reject anyway.
  const ACTIVE = new Set(["recording", "transcribing", "synthesizing"]);

  // States in which the capture phase itself is still open, i.e. the only
  // moment "Finish Class" is meaningful. The server's gate is exactly this:
  // it answers POST /api/stop with 400 unless the status is "recording".
  const RECORDING = "recording";

  // The pipeline's stages, in order, with the statuses in which each one has
  // necessarily *finished*. Derived rendering only -- see the comment on <ol>
  // above. A stage is done when the status is one it could not still be in, so
  // capture is done from `transcribing` onward but not during `recording`: at
  // that point the audio is still being written and calling it finished would
  // be a lie told to a lecturer mid-lecture.
  const STAGES = [
    { id: "capture",    label: "Capture",    doneIn: ["transcribing", "synthesizing", "complete"] },
    { id: "transcribe", label: "Transcribe", doneIn: ["synthesizing", "complete"] },
    { id: "synthesize", label: "Synthesize", doneIn: ["complete"] },
    { id: "notes",      label: "Notes",      doneIn: ["complete"] },
  ];

  const STAGE_STYLES = {
    done:    "border-emerald-500/40 bg-emerald-500/10 text-emerald-300",
    active:  "border-blue-500/50 bg-blue-500/10 text-blue-200 animate-pulse",
    failed:  "border-red-500/50 bg-red-500/10 text-red-300",
    pending: "border-slate-800 bg-slate-900/60 text-slate-600",
  };

  const STAGE_MARKS = { done: "✓", active: "●", failed: "✕", pending: "○" };

  // Connection presentation. "stale" is the one that matters: it marks the
  // card below as showing the last known state rather than a live one.
  const CONNECTION = {
    connecting:  { text: "Connecting to the server...", tone: "amber", stale: true },
    live:        { text: "Live",                            tone: "ok",    stale: false },
    reconnecting:{ text: "Connection lost. Reconnecting...", tone: "amber", stale: true },
    offline:     { text: "Disconnected from the server.",   tone: "red",   stale: true },
  };

  const TONE_CLASSES = {
    amber: "border-amber-900/60 bg-amber-950/30 text-amber-200",
    red:   "border-red-900/60 bg-red-950/40 text-red-300",
    ok:    "border-emerald-900/40 bg-emerald-950/20 text-emerald-200",
  };
  const TONE_DOT = { amber: "bg-amber-400", red: "bg-red-400", ok: "bg-emerald-400" };

  const el = {
    form:           document.getElementById("record-form"),
    button:         document.getElementById("record-button"),
    stopButton:     document.getElementById("stop-button"),
    courseIn:       document.getElementById("course_code"),
    langIn:         document.getElementById("language"),
    tracker:        document.getElementById("stage-tracker"),
    processing:     document.getElementById("processing-state"),
    processingText: document.getElementById("processing-text"),
    card:           document.getElementById("status-card"),
    dot:            document.getElementById("status-dot"),
    label:          document.getElementById("status-label"),
    badge:          document.getElementById("status-badge"),
    message:        document.getElementById("status-message"),
    courseRow:      document.getElementById("status-course"),
    courseVal:      document.getElementById("status-course-value"),
    error:          document.getElementById("form-error"),
    connBox:        document.getElementById("connection-banner"),
    connDot:        document.getElementById("connection-dot"),
    connText:       document.getElementById("connection-text"),
    connRetry:      document.getElementById("connection-retry"),
  };

  // Last state the server told us, and whether it is still current. Kept so a
  // reconnect can re-render without waiting for the next change to arrive.
  let lastState = null;
  let lastStatus = "idle";
  let connection = "connecting";
  let source = null;

  // Set when the operator presses Finish Class, cleared as soon as the server
  // reports a state that is no longer "recording". It is a UI acknowledgement
  // only: the stop is acknowledged by an HTTP 200, but the recording phase
  // genuinely continues until the audio has been flushed, and the server will
  // keep reporting "recording" throughout. Without this flag the button would
  // look inert for the length of the flush.
  let stopRequested = false;

  // True only while a stop request is on the wire. Distinct from
  // ``stopRequested``, which persists after the response: this one guards
  // against a double-submit racing two POSTs, whereas the phase is still
  // legitimately stoppable afterwards.
  let stopInFlight = false;

  function showError(text) {
    el.error.textContent = text;
    el.error.classList.remove("hidden");
  }

  function clearError() {
    el.error.textContent = "";
    el.error.classList.add("hidden");
  }

  /**
   * Draw the stage tracker for a status.
   *
   * Each stage is done if the status is one in which it has necessarily
   * finished, and the first stage that is not done is the active or failed one.
   * Deriving it this way -- rather than tracking "which stage is current" in
   * a variable -- means an out-of-order or repeated frame cannot leave the
   * tracker disagreeing with the status card. Both read the same token, so
   * they cannot drift apart.
   */
  function renderStages(status) {
    const firstOpen = STAGES.findIndex((s) => !s.doneIn.includes(status));

    // A failure is attributed to the stage that was open when it happened.
    // With nothing open -- a run that failed before capture even began -- no
    // stage is marked failed, because claiming one did would be a guess.
    const failedAt = status === "error" && firstOpen >= 0 && lastWasActive
      ? firstOpen
      : -1;

    el.tracker.innerHTML = "";
    STAGES.forEach((stage, index) => {
      const item = document.createElement("li");
      let kind;
      if (stage.doneIn.includes(status)) {
        kind = "done";
      } else if (index === failedAt) {
        kind = "failed";
      } else if (index === firstOpen && ACTIVE.has(status)) {
        kind = "active";
      } else {
        kind = "pending";
      }

      const pill = document.createElement("span");
      pill.id = "stage-" + stage.id;
      pill.dataset.state = kind;
      pill.className =
        "flex flex-1 items-center justify-center gap-1.5 rounded-full border " +
        "px-2.5 py-1.5 text-xs font-medium transition " + STAGE_STYLES[kind];

      // The mark is decorative: the pill text already carries the meaning, and
      // a screen reader announcing "check mark" before "Capture" helps nobody.
      const mark = document.createElement("span");
      mark.setAttribute("aria-hidden", "true");
      mark.className = "font-mono";
      mark.textContent = STAGE_MARKS[kind];

      const text = document.createElement("span");
      text.textContent = stage.label;

      pill.appendChild(mark);
      pill.appendChild(text);
      item.appendChild(pill);
      el.tracker.appendChild(item);
    });
  }

  // Whether a run was in flight the last time a state was rendered. Read by
  // renderStages() to decide if a failure belongs to a stage, and saved before
  // it is updated.
  let lastWasActive = false;

  /** Render one state payload. Total function: unknown states are safe. */
  function render(state) {
    const status = (state && state.status) || "idle";
    const view = LABELS[status] || UNKNOWN;
    const active = ACTIVE.has(status);

    // The pending stop is only meaningful while the capture phase is open. Any
    // other status means the server has moved past it, so the flag is dropped
    // and the button returns to its ordinary "you may press this" state.
    if (status !== RECORDING) {
      stopRequested = false;
    }

    el.label.textContent = view.label;
    el.badge.textContent = status;
    el.badge.className = "rounded-full px-3 py-1 text-xs font-mono uppercase " +
                         "tracking-wide " + view.badge;
    el.message.textContent = (state && state.message) || "";

    // The pulse is the only motion on the page, so it is reserved for a run that
    // is genuinely in progress. A "complete" card that kept blinking would read
    // as still working. It is also suppressed while stale, so a lost connection
    // does not leave a card animating as though work continued.
    el.dot.className = "h-3 w-3 rounded-full " + (view.dot || "bg-transparent");
    el.dot.classList.toggle("hidden", !view.dot);
    el.dot.classList.toggle("animate-pulse", Boolean(view.dot) && active && isLive());

    const course = state && state.course_code;
    el.courseRow.classList.toggle("hidden", !course);
    if (course) {
      el.courseVal.textContent = course;
    }

    renderStages(status);
    lastWasActive = active;
    lastState = state;
    lastStatus = status;

    syncDeck();
  }

  function isLive() {
    return connection === "live";
  }

  /**
   * The control deck reflects the backend's own rules, which is why it needs
   * three independent inputs rather than one flag.
   *
   * A run in flight decides which button exists: only Start Capture while
   * idle/complete/error, only Finish Class while recording, and neither while
   * transcribing or synthesizing. A dead connection disables whatever is
   * showing, because the POST would go nowhere. A pending stop is not a
   * disabling condition -- the endpoint is idempotent while the phase lasts, so
   * a second press is a harmless no-op and leaving the button live is honest
   * about the flush still being in progress.
   */
  function syncDeck() {
    const recording = lastStatus === RECORDING;
    const working = ACTIVE.has(lastStatus);
    const unreachable = connection === "offline";
    const showStart = !working;
    const showStop = recording;

    el.button.classList.toggle("hidden", !showStart);
    el.stopButton.classList.toggle("hidden", !showStop);

    el.button.disabled = unreachable;
    el.stopButton.disabled = unreachable || stopInFlight;

    // The pulse is the operator's cue that capture is *live* and this is the
    // control that ends it. It is suppressed while the connection is down --
    // a button throbbing at a server that is not there would be an invitation
    // to press it and watch nothing happen.
    el.stopButton.classList.toggle(
      "animate-pulse", recording && !unreachable
    );

    el.stopButton.textContent = stopRequested ? "Finishing..." : "Finish Class";

    // The processing strip is the "neither button applies" state. It is shown
    // only for the phases that follow recording, where the run is genuinely
    // un-interruptible from the browser.
    const processing = lastStatus === "transcribing" || lastStatus === "synthesizing";
    el.processing.classList.toggle("hidden", !processing);
    el.processing.classList.toggle("flex", processing);
    if (processing) {
      el.processingText.textContent =
        lastStatus === "transcribing"
          ? "Transcribing the lecture. This is the longest phase..."
          : "Synthesizing your study notes...";
    }

    // Inputs are locked for the whole run, not just while recording: a course
    // code cannot be edited mid-transcription any more than mid-capture, and
    // the value has already been accepted by the server either way.
    el.courseIn.disabled = working;
    el.langIn.disabled = working;

    if (el.button.disabled) {
      el.button.textContent = "Server unreachable";
    } else {
      el.button.textContent = "Start Capture";
    }
  }

  function renderConnection() {
    const view = CONNECTION[connection];
    el.connText.textContent = view.text;
    el.connBox.className = "mt-4 flex items-center gap-2 rounded-lg border px-3 py-2 " +
                           "text-xs " + TONE_CLASSES[view.tone];
    el.connDot.className = "h-2 w-2 shrink-0 rounded-full " + TONE_DOT[view.tone] +
                           (connection === "live" ? "" : " animate-pulse");
    // Manual retry only where auto-reconnect has given up. Calling close() on a
    // transient error would disable the browser's own reconnection, so the
    // button is the deliberate escape hatch, not part of the normal path.
    el.connRetry.classList.toggle("hidden", connection !== "offline");
    syncDeck();
  }

  function connect() {
    if (source) {
      source.close();
      source = null;
    }
    setConnection("connecting");

    const es = new EventSource(STREAM_URL);
    source = es;

    es.onopen = function () {
      // Note: this fires on every successful (re)connect, not just the first.
      setConnection("live");
    };

    es.onmessage = function (event) {
      let payload;
      try {
        payload = JSON.parse(event.data);
      } catch (_) {
        // A single unparseable frame is not worth tearing the stream down for.
        // Ignore it and wait for the next one.
        return;
      }
      setConnection("live");
      render(payload);
    };

    es.onerror = function () {
      // EventSource reconnects on its own for transport failures -- the spec
      // has it retry with a growing backoff, and browsers keep going
      // indefinitely. Calling close() here is the classic mistake: it turns a
      // self-healing blip into a permanent one. So this handler only reports.
      //
      // The one case needing intervention is readyState CLOSED, which means the
      // browser has stopped retrying -- a protocol-level rejection such as a
      // 404 or a wrong Content-Type. No amount of waiting fixes that; a fresh
      // connection might, if the server was mid-restart.
      if (es.readyState === EventSource.CLOSED) {
        es.close();
        source = null;
        setConnection("offline");
      } else {
        setConnection("reconnecting");
      }
    };
  }

  function setConnection(next) {
    if (connection === next) return;
    connection = next;
    renderConnection();
    // Re-render on the last known state so the card's liveness presentation
    // follows the connection: a stale card must stop claiming to be live.
    if (lastState) render(lastState);
  }

  /**
   * Report a rejected request using the backend's own detail.
   *
   * The server explains 409 ("already in progress") and 400 ("no recording is
   * in progress") far better than any generic failure string could, and those
   * two are exactly the responses a racing or stale client will get.
   *
   * ``await`` inside the ``try`` is load-bearing: ``response.json()`` rejects
   * a promise rather than raising, so a synchronous try/catch around the call
   * would let a non-JSON error body escape as a rejection -- which the caller's
   * catch would then report as "could not reach the server", telling the
   * operator their network is down when in fact the server answered fine and
   * simply did not send JSON.
   */
  async function reportFailure(response) {
    let detail = "Request failed (" + response.status + ").";
    try {
      const body = await response.json();
      if (body && body.detail) detail = body.detail;
    } catch (_) {
      // Non-JSON error body; the status line is all that is available.
    }
    showError(detail);
  }

  async function submit(event) {
    event.preventDefault();
    clearError();
    el.button.disabled = true;

    try {
      const response = await fetch(RECORD_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          course_code: el.courseIn.value.trim(),
          language: el.langIn.value.trim().toLowerCase(),
        }),
      });

      if (!response.ok) {
        await reportFailure(response);
        syncDeck();
        return;
      }

      const accepted = await response.json();
      // Draw the accepted state immediately. The stream will push the same state
      // within milliseconds, and rendering it here as well means the deck
      // re-enables correctly even if the stream happens to be down -- a run
      // really is starting, and the operator should be able to submit another
      // once it finishes. The acknowledgement carries no message field, so one
      // is supplied; the stream overwrites it moments later.
      render({
        status: accepted.status || RECORDING,
        course_code: accepted.course_code,
        message: "Recording started. Waiting for the first update...",
      });
    } catch (err) {
      showError("Could not reach the server. Is it still running?");
      syncDeck();
    }
  }

  /**
   * "Finish Class": end the capture phase and let transcription begin.
   *
   * The button is not disabled on success, because the server will keep
   * reporting "recording" until the audio is flushed and the endpoint is
   * idempotent while that is true. Pressing again is a harmless no-op, and
   * the server's 400 -- which can only arrive if the phase already ended --
   * is surfaced rather than swallowed, since it means the operator's view of
   * the world is behind the server's.
   */
  async function requestStop() {
    clearError();
    stopInFlight = true;
    stopRequested = true;
    syncDeck();

    try {
      const response = await fetch(STOP_URL, { method: "POST" });

      if (!response.ok) {
        stopRequested = false;
        await reportFailure(response);
        return;
      }

      // The 200 means the stop was accepted, not that the lecture is finished:
      // the server is still flushing audio. Keep the button showing "Finishing"
      // and let the stream say when the phase actually ended.
    } catch (err) {
      stopRequested = false;
      showError("Could not reach the server. Is it still running?");
    } finally {
      // Re-enables the button in every case, including the failure paths where
      // the phase is still recording and pressing again is the right move.
      stopInFlight = false;
      syncDeck();
    }
  }

  el.form.addEventListener("submit", submit);
  el.stopButton.addEventListener("click", requestStop);
  el.connRetry.addEventListener("click", connect);

  renderConnection();
  connect();
})();
</script>

</body>
</html>
