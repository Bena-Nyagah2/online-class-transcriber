<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Capture Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!--
  Dashboard shell for the lecture pipeline.

  Two constraints shaped this file.

  1. The backend is authoritative. The UI never infers progress from elapsed
     time or from a local countdown; it renders exactly what /api/status
     reports. Inventing a plausible-looking progress bar here would be a lie the
     operator could not detect, and a lecture's real duration is far too
     variable to estimate honestly.

  2. The pipeline has three long phases and no progress reporting inside them.
     Transcription in particular takes tens of minutes and emits nothing. So the
     UI has to make "still working" legible, which is why the active state is a
     labelled, animated status card rather than a line of text.

  No framework and no build step: the shell is a placeholder, and a bundler
  would be a maintenance cost with nothing to amortise it against yet.
-->
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">

  <main class="mx-auto flex min-h-screen max-w-3xl flex-col justify-center px-6 py-12">

    <header class="mb-10 text-center">
      <h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">
        Academic Capture Engine
      </h1>
      <p class="mt-3 text-sm text-slate-400">
        Record a lecture, transcribe it, and generate study notes.
      </p>
    </header>

    <!--
      Start form. Disabled while a run is in flight: the backend answers 409 for
      a second POST, so the button reflects the server's rule instead of letting
      the operator discover it via an error.
    -->
    <section class="rounded-xl border border-slate-800 bg-slate-900/60 p-6 shadow-xl">
      <form id="record-form" class="space-y-5">

        <div>
          <label for="course_code" class="mb-1.5 block text-sm font-medium text-slate-300">
            Course Unit Code
          </label>
          <input
            id="course_code"
            name="course_code"
            type="text"
            required
            maxlength="64"
            placeholder="CRM_1106"
            autocomplete="off"
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-2.5
                   text-slate-100 placeholder-slate-600 outline-none
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-500/40"
          />
        </div>

        <div>
          <label for="language" class="mb-1.5 block text-sm font-medium text-slate-300">
            Language Code
          </label>
          <input
            id="language"
            name="language"
            type="text"
            value="en"
            maxlength="2"
            autocomplete="off"
            class="w-28 rounded-lg border border-slate-700 bg-slate-950 px-4 py-2.5
                   text-slate-100 outline-none
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-500/40"
          />
          <p class="mt-1.5 text-xs text-slate-500">
            Two-letter ISO-639-1 code, e.g. <code class="text-slate-400">en</code> or
            <code class="text-slate-400">sw</code>.
          </p>
        </div>

        <button
          id="record-button"
          type="submit"
          class="w-full rounded-lg bg-blue-600 px-4 py-2.5 font-semibold text-white
                 transition hover:bg-blue-500
                 focus:outline-none focus:ring-2 focus:ring-blue-400
                 disabled:cursor-not-allowed disabled:bg-slate-700 disabled:text-slate-500"
        >
          Start Recording
        </button>
      </form>
    </section>

    <!--
      Live status. Populated entirely from /api/status; every element inside is
      driven by render() below and carries no state of its own.
    -->
    <section
      id="status-card"
      class="mt-8 rounded-xl border border-slate-800 bg-slate-900/60 p-6"
      aria-live="polite"
    >
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <!-- Pulse dot: visible only while a run is active. Purely decorative,
               so it is hidden from assistive tech. -->
          <span
            id="status-dot"
            class="hidden h-3 w-3 rounded-full bg-blue-500"
            aria-hidden="true"
          ></span>
          <h2 class="text-lg font-semibold text-white">
            <span id="status-label">Idle</span>
          </h2>
        </div>
        <span
          id="status-badge"
          class="rounded-full px-3 py-1 text-xs font-mono uppercase tracking-wide
                 bg-slate-800 text-slate-400"
        >
          idle
        </span>
      </div>

      <p id="status-message" class="mt-3 text-sm leading-relaxed text-slate-400">
        Ready. Submit a course code to begin a recording.
      </p>

      <p id="status-course" class="mt-2 hidden text-sm text-slate-500">
        Course: <span id="status-course-value" class="font-mono text-slate-300"></span>
      </p>
    </section>

    <!--
      Start-form feedback. Kept separate from the status card so a rejected
      submission (409, 422) is not mistaken for the pipeline's own state.
    -->
    <p
      id="form-error"
      class="mt-4 hidden rounded-lg border border-red-900/60 bg-red-950/40 px-4 py-3 text-sm text-red-300"
      role="alert"
    ></p>

  </main>

<script>
(() => {
  "use strict";

  // Poll cadence. Two seconds is a compromise: fast enough that a phase change
  // feels immediate, slow enough that a dashboard left open all day does not
  // generate thousands of requests. Nothing here is time-critical -- a lecture
  // phase runs for minutes -- so there is no case for a tighter loop.
  const POLL_MS = 2000;

  // Backend status tokens -> what the operator sees. Kept as a lookup rather
  // than a chain of ifs so an unrecognised token falls through to a safe
  // default instead of rendering as raw snake_case.
  const LABELS = {
    idle:         { label: "Idle",          dot: null,  badge: "bg-slate-800 text-slate-400" },
    recording:    { label: "Recording",     dot: "bg-red-500",    badge: "bg-red-500/20 text-red-300" },
    transcribing: { label: "Transcribing",  dot: "bg-blue-500",   badge: "bg-blue-500/20 text-blue-300" },
    synthesizing: { label: "Synthesizing",  dot: "bg-blue-500",   badge: "bg-blue-500/20 text-blue-300" },
    complete:     { label: "Complete",      dot: "bg-emerald-500",badge: "bg-emerald-500/20 text-emerald-300" },
    error:        { label: "Failed",        dot: "bg-amber-500",  badge: "bg-amber-500/20 text-amber-300" },
  };

  const UNKNOWN = { label: "Unknown", dot: null, badge: "bg-slate-800 text-slate-400" };

  // States in which a run is in flight. The form is locked during these so the
  // operator cannot queue a second recording the backend will reject anyway.
  const ACTIVE = new Set(["recording", "transcribing", "synthesizing"]);

  const el = {
    form:      document.getElementById("record-form"),
    button:    document.getElementById("record-button"),
    courseIn:  document.getElementById("course_code"),
    langIn:    document.getElementById("language"),
    card:      document.getElementById("status-card"),
    dot:       document.getElementById("status-dot"),
    label:     document.getElementById("status-label"),
    badge:     document.getElementById("status-badge"),
    message:   document.getElementById("status-message"),
    courseRow: document.getElementById("status-course"),
    courseVal: document.getElementById("status-course-value"),
    error:     document.getElementById("form-error"),
  };

  function showError(text) {
    el.error.textContent = text;
    el.error.classList.remove("hidden");
  }

  function clearError() {
    el.error.textContent = "";
    el.error.classList.add("hidden");
  }

  /** Render one /api/status payload. Total function: unknown states are safe. */
  function render(state) {
    const status = (state && state.status) || "idle";
    const view = LABELS[status] || UNKNOWN;
    const active = ACTIVE.has(status);

    el.label.textContent = view.label;
    el.badge.textContent = status;
    el.badge.className = "rounded-full px-3 py-1 text-xs font-mono uppercase " +
                         "tracking-wide " + view.badge;
    el.message.textContent = (state && state.message) || "";

    // The pulse is the only motion on the page, so it is reserved for a run that
    // is genuinely in progress. A "complete" card that kept blinking would read
    // as still working.
    el.dot.className = "h-3 w-3 rounded-full " + (view.dot || "bg-transparent");
    el.dot.classList.toggle("hidden", !view.dot);
    el.dot.classList.toggle("animate-pulse", Boolean(view.dot) && active);

    const course = state && state.course_code;
    el.courseRow.classList.toggle("hidden", !course);
    if (course) {
      el.courseVal.textContent = course;
    }

    el.button.disabled = active;
    el.button.textContent = active ? "Recording in progress..." : "Start Recording";
    el.card.classList.toggle("ring-1", active);
    el.card.classList.toggle("ring-blue-500/40", active);
  }

  /** Poll the backend. Failures are non-fatal: the last known state stays put. */
  async function poll() {
    try {
      const response = await fetch("/api/status", { cache: "no-store" });
      if (!response.ok) throw new Error("status " + response.status);
      render(await response.json());
    } catch (err) {
      // Deliberately silent on the card. A dashboard that blanks itself every
      // time the dev server hiccups is worse than one that shows slightly stale
      // truth; the next tick usually recovers.
    }
  }

  async function submit(event) {
    event.preventDefault();
    clearError();
    el.button.disabled = true;

    try {
      const response = await fetch("/api/record", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          course_code: el.courseIn.value.trim(),
          language: (el.langIn.value.trim() || "en").toLowerCase(),
        }),
      });

      if (!response.ok) {
        // Surface the backend's own detail -- it explains 409 ("already in
        // progress") far better than a generic failure string would.
        let detail = "Request failed (" + response.status + ").";
        try {
          const body = await response.json();
          if (body && body.detail) detail = body.detail;
        } catch (_) { /* non-JSON error body; keep the generic message */ }
        showError(detail);
        el.button.disabled = false;
        return;
      }

      // Draw the accepted state immediately rather than waiting up to two
      // seconds for the first poll to catch up.
      render(await response.json());
    } catch (err) {
      showError("Could not reach the server. Is it still running?");
      el.button.disabled = false;
    }
  }

  el.form.addEventListener("submit", submit);
  poll();
  setInterval(poll, POLL_MS);
})();
</script>

</body>
</html>
