<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lecture Playback — Academic Capture Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
  <div class="mx-auto max-w-7xl px-6 py-8 space-y-6">
    <!-- Top Bar -->
    <div class="flex flex-wrap items-center justify-between gap-4 rounded-2xl border border-slate-800 bg-slate-900/70 px-6 py-4 shadow-lg shadow-black/20">
      <div>
        <h1 class="text-xl font-semibold text-slate-50">Lecture Playback</h1>
        <p class="text-sm text-slate-400">Click a timestamp to seek the audio. Click a slide reference to preview it.</p>
      </div>
      <a href="/" class="inline-flex items-center gap-2 rounded-lg border border-slate-700 bg-slate-950 px-4 py-2 text-sm font-medium text-slate-300 transition hover:border-blue-500 hover:text-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
        ← Back to Recorder
      </a>
    </div>

    <div id="errorBox" class="hidden rounded-2xl border border-rose-500/40 bg-rose-900/20 p-6 text-sm text-rose-200">
      <p class="font-medium">Playback failed</p>
      <p id="errorText" class="mt-1 text-rose-100/80"></p>
    </div>

    <!-- Two-pane layout -->
    <div class="grid grid-cols-1 gap-8 lg:grid-cols-12">
      <!-- Left Pane: Notes -->
      <div class="lg:col-span-7 xl:col-span-8">
        <section class="flex h-[calc(100vh-13rem)] flex-col rounded-2xl border border-slate-800 bg-slate-900/60 shadow-lg shadow-black/20">
          <header class="border-b border-slate-800 px-6 py-4">
            <h2 class="text-lg font-semibold text-slate-50">Study Notes</h2>
            <p class="mt-1 text-sm text-slate-400">Interactive transcript — timestamps and slides are clickable.</p>
          </header>
          <div id="notesContainer" class="prose prose-invert prose-slate max-w-none flex-1 overflow-y-auto px-6 py-6"></div>
        </section>
      </div>

      <!-- Right Pane: Media -->
      <div class="lg:col-span-5 xl:col-span-4">
        <aside class="sticky top-8 flex flex-col gap-6 rounded-2xl border border-slate-800 bg-slate-900/60 p-6 shadow-lg shadow-black/20">
          <div>
            <h2 class="text-lg font-semibold text-slate-50">Playback</h2>
            <p class="mt-1 text-sm text-slate-400">Audio follows the notes. Click a [MM:SS] to seek.</p>
          </div>

          <audio id="audioPlayer" controls preload="metadata" class="w-full rounded-lg">
            Your browser does not support the audio element.
          </audio>

          <div id="slideWrapper" class="hidden">
            <h3 class="mb-3 text-sm font-medium text-slate-300">Slide Preview</h3>
            <img id="slideViewer" src="" alt="Lecture slide" class="w-full rounded-lg border border-slate-700 bg-black object-contain" />
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const errorBox = document.getElementById("errorBox");
      const errorText = document.getElementById("errorText");
      const notesContainer = document.getElementById("notesContainer");
      const audioPlayer = document.getElementById("audioPlayer");
      const slideWrapper = document.getElementById("slideWrapper");
      const slideViewer = document.getElementById("slideViewer");

      function showError(message) {
        errorText.textContent = message;
        errorBox.classList.remove("hidden");
      }

      function hideError() {
        errorBox.classList.add("hidden");
      }

      function parseSessionId() {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get("id");
        if (!raw) return null;
        const id = parseInt(raw, 10);
        return Number.isNaN(id) ? null : id;
      }

      function hhmmssToSeconds(hh, mm) {
        const seconds = parseInt(hh || "0", 10) * 60 + parseInt(mm || "0", 10);
        return seconds;
      }

      async function loadSession() {
        hideError();
        const sessionId = parseSessionId();
        if (sessionId === null) {
          showError("Missing session id. Open playback with ?id=<session_id>.");
          return;
        }

        try {
          const res = await fetch(`/api/sessions/${sessionId}`, {
            headers: { "Accept": "application/json" },
          });
          if (res.status === 404) {
            showError(`No recorded session with id ${sessionId} was found.`);
            return;
          }
          if (!res.ok) {
            showError(`The server returned ${res.status}.`);
            return;
          }

          const data = await res.json();
          if (!data) {
            showError("Received an empty response from the server.");
            return;
          }

          if (!data.markdown_text) {
            showError("This session has no readable study notes on disk. The Markdown file may have been moved or deleted.");
            return;
          }

          if (!data.audio_url) {
            showError("This session has no playable audio. The raw audio file may have been moved or deleted.");
            return;
          }

          // Set audio source
          audioPlayer.src = data.audio_url;
          audioPlayer.load();

          // Hijack: clickable timestamps and slide references
          let hijacked = data.markdown_text;
          // Replace timestamps [MM:SS] or [M:SS] with a button that seeks the audio
          hijacked = hijacked.replace(/\[(\d{1,2}):(\d{2})\]/g, function (_match, mm, ss) {
            const total = hhmmssToSeconds(mm, ss);
            return `<button class="timestamp-btn text-blue-400 hover:text-blue-300 font-mono underline-offset-4 hover:underline" data-time="${total}">${_match}</button>`;
          });

          // Replace slide references slide_XXX.jpg with a clickable preview button
          hijacked = hijacked.replace(/(slide_\d+\.jpg)/g, function (_match, filename) {
            return `<button class="slide-btn text-purple-400 hover:text-purple-300 font-mono underline-offset-4 hover:underline" data-slide="${filename}">${_match}</button>`;
          });

          // Render Markdown
          notesContainer.innerHTML = marked.parse(hijacked);

          // Store slides prefix for delegation to use
          notesContainer.dataset.slidesPrefix = data.slides_url_prefix || "";

          // Wire single event delegation
          notesContainer.addEventListener("click", function (event) {
            const target = event.target;
            if (!target || target === notesContainer) return;

            if (target.classList.contains("timestamp-btn")) {
              const time = parseFloat(target.getAttribute("data-time") || "0");
              if (!Number.isNaN(time)) {
                audioPlayer.currentTime = time;
                try {
                  audioPlayer.play();
                } catch (err) {
                  // Autoplay may be blocked by browser; seeking still works.
                }
              }
              return;
            }

            if (target.classList.contains("slide-btn")) {
              const filename = target.getAttribute("data-slide");
              const prefix = notesContainer.dataset.slidesPrefix || "";
              if (filename && prefix) {
                slideViewer.src = prefix + filename;
                slideWrapper.classList.remove("hidden");
                // Scroll the slide into view on smaller screens when opened
                slideWrapper.scrollIntoView({ behavior: "smooth", block: "nearest" });
              } else if (filename && !prefix) {
                // No slides directory accessible; keep hidden to avoid a broken image
                slideWrapper.classList.add("hidden");
                showError("Slides directory is not available for this session.");
              }
              return;
            }
          });
        } catch (err) {
          showError("Could not load the session. Check the network and try again.");
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadSession);
      } else {
        loadSession();
      }
    })();
  </script>
</body>
</html>
